name: Keep Render Backend Alive

on:
  schedule:
    # Runs every 10 minutes to prevent Render free-tier cold starts
    - cron: '*/10 * * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

jobs:
  ping-render:
    runs-on: ubuntu-latest
    steps:
      - name: Ping HerAI Render Backend
        run: |
          echo "Pinging Render backend at $(date)..."
          STATUS_CODE=$(curl -s -o /dev/null -w "%{http_code}" https://deep-conversation-intelligence-rag.onrender.com/health)
          echo "Render responded with status code: $STATUS_CODE"
          if [ "$STATUS_CODE" -eq 200 ]; then
            echo "Render instance is active and warm! 🚀"
          else
            echo "Unexpected status: $STATUS_CODE"
          fi
